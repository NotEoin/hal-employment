# Tests on Linux (two Pythons) and Windows for every push.
# Ruff and the ASCII check run on lines added since the push's parent, because older code still has
# findings that are fixed line by line as it is edited.
# Run one test at a time, the suite took 27 minutes on Linux and 38 on Windows (run 43266048071): each
# platform now runs it in five shares, each spread over the runner's CPUs (scripts/dev/run_tests.py).
# The Windows-only checks must pass, not skip, in whichever share holds them: Windows is the one place they
# can run.
name: ci
on: [push, pull_request]
jobs:
  test:
    name: test (${{ matrix.target.os }}, ${{ matrix.target.python }}, share ${{ matrix.share }} of 5)
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: ubuntu-24.04, python: "3.11", extras: "--extra browser --extra documents", must: "" }
          - { os: ubuntu-24.04, python: "3.13", extras: "--extra browser --extra documents", must: "" }
          # The Windows-only checks: the install file's PowerShell parses under Windows PowerShell 5.1, CVs
          # print with Microsoft Edge, and the platform layer finds browsers and opens Hal in the default browser
          - os: windows-2025
            python: "3.13"
            extras: "--extra browser"
            must: >-
              --must-pass test_the_powershell_part_parses test_accented_names_print_in_every_look
              test_hal_opens_in_the_default_browser_on_windows_not_an_edge_app_window
              test_browsers_are_found_from_app_paths_and_install_folders
        share: [1, 2, 3, 4, 5]     # the 5 in the job name and the run step
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 20
    # uv run would otherwise make a fresh venv on .python-version's Python, without the extras
    env: { UV_PYTHON: "${{ matrix.target.python }}" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { fetch-depth: 2 }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - run: uv sync --frozen ${{ matrix.target.extras }} --python ${{ matrix.target.python }}
      # poppler is only the reference the PDF reader is compared with (tests/test_pdfread.py); Hal never needs it
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - if: runner.os == 'Linux'
        run: uv run python -m playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: uv run python -m playwright install chromium
      # the root commit has no parent, so only the whole-tree ASCII check below applies to it
      - name: ASCII and ruff on the lines this commit adds
        shell: bash
        run: |
          if git rev-parse -q --verify HEAD~1 >/dev/null; then
            uv run python scripts/dev/check_ascii.py --base HEAD~1
            uv run python scripts/dev/check_ruff.py --base HEAD~1
          fi
      - run: uv run python scripts/dev/check_ascii.py --tree
      # The browser tests open a connection per request, and late in one run Windows ran out
      # (net::ERR_NO_BUFFER_SPACE). This doubles its default 16384 client ports, above the tests' 20000-29999.
      - if: runner.os == 'Windows'
        run: netsh int ipv4 set dynamicport tcp start=32768 num=32768
      - name: Tests, browser on
        run: uv run python scripts/dev/run_tests.py --share ${{ matrix.share }}/5 ${{ matrix.target.must }}
        env: { HAL_TEST_MODE: "1", HAL_TEST_BROWSER: "1" }

  # The Linux install inside WSL2. Advisory until the first green run shows the suite passes under WSL2,
  # so an unproven runner cannot block a merge. It runs the hermetic suite with the browser tests off, in two
  # shares; the browser and the GPU are not set up on the runner.
  wsl:
    name: wsl2 (ubuntu 24.04, share ${{ matrix.share }} of 2)
    strategy:
      fail-fast: false
      matrix: { share: [1, 2] }
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      # WSL does not inherit the runner environment: WSLENV names what to pass in (/p converts a path)
      WSLENV: GITHUB_WORKSPACE/p
    steps:
      - name: Keep line endings as LF
        # The install scripts and fakes are shell scripts; a CRLF shebang line would not run in WSL
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: pipx python3-venv git curl

      - name: Copy the checkout into the WSL filesystem
        # /mnt/d has no Unix permissions, and the suite checks file modes
        shell: wsl-bash {0}
        run: |
          # WSLENV's /p already makes the path a WSL one (/mnt/d/a/...), and wslpath on that made
          # /mnt/d/mnt/d/a/... (run 41633262148); it converts only a path that arrived as Windows wrote it
          src="$GITHUB_WORKSPACE"
          [ -d "$src" ] || src="$(wslpath -u "$src")"
          rm -rf "$HOME/hal-employment"
          cp -r "$src" "$HOME/hal-employment"

      - name: Install uv
        shell: wsl-bash {0}
        run: |
          pipx install uv==0.8.0
          "$HOME/.local/bin/uv" --version

      - name: Test
        shell: wsl-bash {0}
        run: |
          # Ubuntu 24.04's own Python is 3.12; .python-version's 3.13 is not there and downloads are off
          # (run 41959197666)
          export PATH="$HOME/.local/bin:$PATH" UV_PYTHON_DOWNLOADS=never UV_PYTHON=3.12
          cd "$HOME/hal-employment"
          uv sync --frozen
          HAL_TEST_MODE=1 uv run python scripts/dev/run_tests.py --share ${{ matrix.share }}/2
