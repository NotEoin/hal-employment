# CI: tests on Linux and Windows.
# Ruff and the ASCII check run on lines added since the push's parent, because the code at ef53088 still has
# findings that its later owners fix line by line.
name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.11", extras: "--extra browser --extra documents" }
          - { os: ubuntu-24.04, python: "3.13", extras: "--extra browser --extra documents" }
          - { os: windows-2025, python: "3.13", extras: "--extra browser" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { fetch-depth: 2 }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - run: uv sync --frozen ${{ matrix.extras }} --python ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: uv run python -m playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: uv run python -m playwright install chromium
      - run: uv run python scripts/dev/check_ascii.py --base HEAD~1
      - run: uv run python scripts/dev/check_ruff.py --base HEAD~1
      - run: uv run python scripts/dev/check_ascii.py --tree
      - run: uv run python -m unittest discover tests -v
        env: { HAL_TEST_MODE: "1", HAL_TEST_BROWSER: "1" }
