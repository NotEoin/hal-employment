# Tests on Linux (two Pythons) and Windows for every push.
# Ruff and the ASCII check run on lines added since the push's parent, because older code still has
# findings that are fixed line by line as it is edited. The test output is kept in tests.log so the Windows
# job can prove its own checks ran: a skip there would hide the one place they can run.
name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.11", extras: "--extra browser --extra documents" }
          - { os: ubuntu-24.04, python: "3.13", extras: "--extra browser --extra documents" }
          - { os: windows-2025, python: "3.13", extras: "--extra browser" }
    runs-on: ${{ matrix.os }}
    # Windows ran 1274 tests in about 28 minutes (run 39958993847) and Linux in about 15
    timeout-minutes: 45
    # uv run would otherwise make a fresh venv on .python-version's Python, without the extras
    env: { UV_PYTHON: "${{ matrix.python }}" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { fetch-depth: 2 }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - run: uv sync --frozen ${{ matrix.extras }} --python ${{ matrix.python }}
      # poppler is only the reference the PDF reader is compared with (tests/test_pdfread.py); Hal never needs it
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - if: runner.os == 'Linux'
        run: uv run python -m playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: uv run python -m playwright install chromium
      # the root commit has no parent, so only the whole-tree ASCII check below applies to it
      - name: ASCII and ruff on the lines this commit adds
        shell: bash
        run: |
          if git rev-parse -q --verify HEAD~1 >/dev/null; then
            uv run python scripts/dev/check_ascii.py --base HEAD~1
            uv run python scripts/dev/check_ruff.py --base HEAD~1
          fi
      - run: uv run python scripts/dev/check_ascii.py --tree
      # The browser tests open a connection per request, and late in one run Windows ran out
      # (net::ERR_NO_BUFFER_SPACE). This doubles its default 16384 client ports, above the tests' 20000-29999.
      - if: runner.os == 'Windows'
        run: netsh int ipv4 set dynamicport tcp start=32768 num=32768
      # bash runs with pipefail, so a failing test still fails the step through tee
      - name: Tests, browser on
        shell: bash
        run: uv run python -m unittest discover tests -v 2>&1 | tee tests.log
        env: { HAL_TEST_MODE: "1", HAL_TEST_BROWSER: "1", PYTHONUNBUFFERED: "1" }
      # The Windows-only checks: the install file's PowerShell parses under Windows PowerShell 5.1,
      # CVs print with Microsoft Edge, and the platform layer finds browsers and opens the window with Edge.
      # unittest prints a test's docstring on the line after its name, so the result may be one line down, and
      # Python on Windows ends the lines with CR LF.
      - if: runner.os == 'Windows'
        name: The Windows-only checks ran and passed
        shell: bash
        run: |
          for t in test_the_powershell_part_parses test_accented_names_print_in_every_look test_the_app_window_is_edge_on_windows test_browsers_are_found_from_app_paths_and_install_folders; do
            awk -v t="$t" '{ sub(/\r$/, "") }
              found { ok = /\.\.\. ok$/; exit }
              index($0, t " (") == 1 { if (/ \.\.\. /) { ok = /\.\.\. ok$/; exit } found = 1 }
              END { exit !ok }' tests.log || { echo "::error::$t was skipped or failed"; exit 1; }
          done
