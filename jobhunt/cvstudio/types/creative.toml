# Built-in CV type. Copy it in My CV to change it; this file stays as it is.
id = "creative"
name = "Creative or portfolio"
fits = "Design, writing, media"
note = "Puts your best work first."
order_words = "Profile and portfolio link, Selected work, Experience"
length_words = "1 to 2 pages"
pages = 2
section_order = ["summary", "portfolio", "experience", "education", "skills"]
optional_sections = ["achievements", "volunteering", "talks", "interests"]
tips = [
  "Put your portfolio link at the top, written out in full.",
  "Choose three to six pieces: for each, the brief, your part and what came of it.",
  "Paid internships, freelance work and commissions all count as experience.",
]

[suggest]
stages = ["new_grad", "early", "student", "experienced", "changing"]
subjects = ["art", "design", "illustration", "animation", "photography", "film", "fashion", "graphic",
            "creative writing", "journalism", "media production", "music production", "fine art", "architecture"]
roles = ["designer", "illustrator", "copywriter", "photographer", "animator", "journalist", "video",
         "content creator", "editor", "artist", "ux", "producer", "art worker"]

[sections.summary]
title = "Profile"
max_words = 50
[sections.portfolio]
title = "Selected work"
max_entries = 6
max_bullets = 2
[sections.experience]
title = "Experience"
max_entries = 4
max_bullets = 3
[sections.education]
title = "Education"
max_entries = 2
show_modules = "none"
dissertation = false
[sections.skills]
title = "Skills"
style = "list"

[writing]
person = "none"
style = "bullets"
bullet_words = [6, 30]
verb_first = true
results = "where_have"
spelling = "en-GB"
tone = "plain"
banned = ["passionate", "team player", "go-getter", "creative thinker", "references available on request"]

[checks]
portfolio_link = 3
profile_evidence = 1
result_bullets = 1
entry_says_what = 1
dates_one_format = 1
no_personal_data = 2
pages_within = 1
one_spelling = 1
contact_at_top = 1

[keywords]
skills = ["Adobe Creative Cloud", "Photoshop", "Illustrator", "InDesign", "Figma", "copywriting",
          "editing", "video editing", "photography", "social media", "branding", "typography"]
aliases = { "adobe creative cloud" = ["adobe cc", "creative suite"], "video editing" = ["premiere", "final cut"] }

[documents]
evidence = ["selected work", "commissions and freelance work", "experience"]
letter_mentions = "one piece of work that fits the brief, with the portfolio link"
hiring_titles = ["creative director", "design lead", "studio manager", "editor"]
prep_topics = ["talking through your portfolio", "a set brief", "why this studio"]
special_cases = []

[prompts]
letter = ""
cv_suggest = ""
