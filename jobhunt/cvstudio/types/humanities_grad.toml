# Built-in CV type. Copy it in My CV to change it; this file stays as it is.
id = "humanities_grad"
name = "Humanities and social science graduate"
fits = "Recent graduates in history, politics, English, languages and similar"
note = "Shows the dissertation and strong modules. Short paragraphs or bullets."
order_words = "Profile, Education, Volunteering or experience, Skills"
length_words = "Up to 2 pages"
pages = 2
section_order = ["summary", "education", "volunteering", "experience", "skills", "interests"]
optional_sections = ["projects", "achievements", "languages", "certifications"]
tips = [
  "Your dissertation is research experience: give its title and one line on what you found.",
  "Volunteering, societies and part-time work count. Say what you did and what came of it.",
  "A paid internship or a short placement in a museum, archive, charity or council is a strong first step. List it as experience, with its dates.",
]

[suggest]
stages = ["new_grad", "early"]
subjects = ["history", "politics", "english", "literature", "languages", "philosophy", "classics", "sociology",
            "anthropology", "geography", "theology", "religious", "archaeology", "international relations",
            "law", "criminology", "psychology", "social", "humanities", "art history", "music", "drama"]
roles = ["museum", "archive", "heritage", "policy", "research assistant", "charity", "council", "library",
         "communications", "editorial", "publishing", "civil service", "campaigns", "curator"]

[sections.summary]
title = "Profile"
max_words = 70
[sections.education]
title = "Education"
max_entries = 2
show_modules = "strong"
min_mark = 65
dissertation = true
[sections.volunteering]
title = "Volunteering"
max_entries = 3
max_bullets = 3
[sections.experience]
title = "Work experience"
max_entries = 4
max_bullets = 3
[sections.skills]
title = "Skills"
style = "groups"
[sections.interests]
title = "Interests"
optional = true

[writing]
person = "none"
style = "bullets"
bullet_words = [8, 30]
verb_first = true
results = "where_have"
spelling = "en-GB"
tone = "plain"
banned = ["passionate", "hard-working", "team player", "go-getter", "references available on request"]

[checks]
profile_evidence = 2
result_bullets = 2
dissertation_shown = 1
dates_one_format = 1
no_personal_data = 2
pages_within = 1
one_spelling = 1
entry_says_what = 1
contact_at_top = 1

[keywords]
skills = ["research", "archival research", "report writing", "Excel", "NVivo", "copywriting", "editing",
          "presenting", "data analysis", "cataloguing", "social media", "public engagement", "policy analysis"]
aliases = { excel = ["spreadsheets", "microsoft excel"], "report writing" = ["reports", "briefings"] }

[documents]
evidence = ["dissertation", "strong modules", "volunteering", "part-time work"]
letter_mentions = "the dissertation and the most relevant volunteering or work"
hiring_titles = ["hiring manager", "head of research", "policy manager", "team leader"]
prep_topics = ["why this sector", "a written exercise", "competency questions"]
special_cases = []

[prompts]
letter = ""
cv_suggest = ""
