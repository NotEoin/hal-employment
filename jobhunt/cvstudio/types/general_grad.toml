# Built-in CV type. Copy it in My CV to change it; this file stays as it is.
id = "general_grad"
name = "Graduate, any subject"
fits = "Any degree, applying to graduate jobs and schemes across sectors"
note = "Education first, then what you did and what came of it. Plain words."
order_words = "Profile, Education, Experience, Volunteering, Skills"
length_words = "Up to 2 pages"
pages = 2
section_order = ["summary", "education", "experience", "volunteering", "skills", "interests"]
optional_sections = ["projects", "achievements", "languages", "certifications"]
tips = [
  "Most graduate jobs are open to any degree. Lead with what you did, not the subject.",
  "Part-time jobs show reliability and dealing with people: say what you were trusted with.",
  "A paid internship, a placement or a fixed-term job is a good stepping stone. List each with its dates.",
]

[suggest]
stages = ["new_grad", "early"]
subjects = []
roles = ["graduate", "trainee", "assistant", "coordinator", "administrator", "officer"]

[sections.summary]
title = "Profile"
max_words = 60
[sections.education]
title = "Education"
max_entries = 2
show_modules = "strong"
min_mark = 65
dissertation = false
[sections.experience]
title = "Work experience"
max_entries = 4
max_bullets = 3
[sections.volunteering]
title = "Volunteering"
max_entries = 3
max_bullets = 2
[sections.skills]
title = "Skills"
style = "groups"
[sections.interests]
title = "Interests"
optional = true

[writing]
person = "none"
style = "bullets"
bullet_words = [8, 30]
verb_first = true
results = "where_have"
spelling = "en-GB"
tone = "plain"
banned = ["passionate", "hard-working", "team player", "go-getter", "references available on request"]

[checks]
profile_evidence = 1
result_bullets = 2
education_first = 1
skills_backed = 1
dates_one_format = 1
no_personal_data = 2
pages_within = 1
one_spelling = 1
entry_says_what = 1
contact_at_top = 1

[keywords]
skills = ["communication", "customer service", "Excel", "organisation", "research", "writing", "presenting",
          "teamwork", "time management", "data entry", "problem solving"]
aliases = { excel = ["spreadsheets", "microsoft excel"], organisation = ["organising", "organised"] }

[documents]
evidence = ["the degree", "work experience", "volunteering", "skills shown in use"]
letter_mentions = "the most relevant work or volunteering and why this employer"
hiring_titles = ["hiring manager", "team leader", "graduate recruitment team"]
prep_topics = ["why this employer", "competency questions", "a situational test"]
special_cases = []

[prompts]
letter = ""
cv_suggest = ""
