# Built-in CV type. Copy it in My CV to change it; this file stays as it is.
id = "stem_grad"
name = "Science, engineering and maths graduate"
fits = "Lab, field and engineering work: biology, chemistry, physics, maths, civil and mechanical engineering"
note = "Your final-year project, lab and field skills, and results with numbers."
order_words = "Profile, Education, Projects and research, Experience, Skills"
length_words = "1 to 2 pages"
pages = 2
section_order = ["summary", "education", "research", "projects", "experience", "skills"]
optional_sections = ["publications", "certifications", "achievements", "volunteering", "interests"]
tips = [
  "Name the methods and equipment you used in your final-year project, and what you found.",
  "Safety training, first aid and lab inductions belong under Certifications.",
  "A summer research placement, a paid internship or a placement year counts as experience: give its dates and your part in the work.",
]

[suggest]
stages = ["new_grad", "early"]
subjects = ["biology", "biomedical", "chemistry", "physics", "mathematics", "maths", "statistics", "engineering",
            "mechanical", "civil", "chemical", "aerospace", "environmental", "geology", "earth science",
            "biochemistry", "pharmacology", "natural sciences", "astrophysics", "materials", "zoology", "ecology"]
roles = ["laboratory", "lab ", "scientist", "technician", "graduate engineer", "analyst", "research assistant",
         "quality", "process", "environmental", "actuarial", "consultant", "field"]

[sections.summary]
title = "Profile"
max_words = 60
[sections.education]
title = "Education"
max_entries = 2
show_modules = "strong"
min_mark = 65
dissertation = true
[sections.research]
title = "Research"
max_entries = 3
max_bullets = 3
[sections.projects]
title = "Projects"
max_entries = 3
max_bullets = 3
[sections.experience]
title = "Experience"
max_entries = 3
max_bullets = 3
[sections.skills]
title = "Skills"
style = "groups"

[writing]
person = "none"
style = "bullets"
bullet_words = [8, 35]
verb_first = true
results = "where_have"
spelling = "en-GB"
tone = "plain"
banned = ["passionate", "team player", "go-getter", "references available on request"]

[checks]
profile_evidence = 1
result_bullets = 2
dissertation_shown = 2
projects_with_evidence = 1
education_first = 1
skills_backed = 1
dates_one_format = 1
no_personal_data = 2
pages_within = 1
one_spelling = 1
entry_says_what = 1
contact_at_top = 1
no_module_codes = 1

[keywords]
skills = ["data analysis", "statistics", "Python", "MATLAB", "R", "Excel", "CAD", "laboratory techniques",
          "report writing", "health and safety", "project management", "fieldwork", "modelling"]
aliases = { "laboratory techniques" = ["lab techniques", "lab work"], excel = ["spreadsheets"], cad = ["autocad", "solidworks"] }

[documents]
evidence = ["final-year project", "lab and field work", "strong modules", "work experience"]
letter_mentions = "the final-year project and the methods or results closest to the job"
hiring_titles = ["hiring manager", "laboratory manager", "engineering manager", "team leader"]
prep_topics = ["questions about your project", "a technical or numerical test", "competency questions"]
special_cases = []

[prompts]
letter = ""
cv_suggest = ""
