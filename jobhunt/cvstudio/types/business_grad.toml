# Built-in CV type. Copy it in My CV to change it; this file stays as it is.
id = "business_grad"
name = "Business, finance and marketing graduate"
fits = "Business, economics, finance, accounting, marketing and management graduates"
note = "Results with numbers, positions of responsibility and commercial awareness."
order_words = "Profile, Education, Experience, Positions of responsibility, Skills"
length_words = "1 page"
pages = 1
section_order = ["summary", "education", "experience", "achievements", "skills", "interests"]
optional_sections = ["volunteering", "certifications", "languages", "projects"]
tips = [
  "Give each result a number where you have one: money raised, customers served, time saved.",
  "Society roles, student consulting and competitions count as positions of responsibility.",
  "Spring weeks, insight weeks and paid summer internships lead to many graduate schemes. List each with its dates.",
]

[suggest]
stages = ["new_grad", "early"]
subjects = ["business", "economics", "finance", "accounting", "accountancy", "marketing", "management",
            "banking", "commerce", "hospitality", "tourism", "human resource", "supply chain", "events"]
roles = ["finance", "accountant", "audit", "tax", "banking", "marketing", "sales", "business analyst",
         "consultant", "management trainee", "account executive", "recruitment", "hr ", "operations",
         "buyer", "merchandiser", "procurement"]

[sections.summary]
title = "Profile"
max_words = 50
[sections.education]
title = "Education"
max_entries = 2
show_modules = "strong"
min_mark = 65
dissertation = false
[sections.experience]
title = "Experience"
max_entries = 4
max_bullets = 3
[sections.achievements]
title = "Positions of responsibility"
max_entries = 3
max_bullets = 2
[sections.skills]
title = "Skills"
style = "groups"
[sections.interests]
title = "Interests"
optional = true

[writing]
person = "none"
style = "bullets"
bullet_words = [8, 30]
verb_first = true
results = "where_have"
spelling = "en-GB"
tone = "confident"
banned = ["passionate", "team player", "go-getter", "synergy", "results-driven", "references available on request"]

[checks]
profile_evidence = 1
result_bullets = 3
education_first = 1
dates_one_format = 1
no_personal_data = 2
pages_within = 1
one_spelling = 1
entry_says_what = 1
contact_at_top = 1
right_to_work_line = 1

[keywords]
skills = ["Excel", "financial modelling", "PowerPoint", "stakeholder management", "data analysis", "CRM",
          "sales", "marketing", "budgeting", "forecasting", "SQL", "Power BI", "customer service", "negotiation"]
aliases = { excel = ["spreadsheets", "microsoft excel"], crm = ["salesforce", "hubspot"], "power bi" = ["powerbi"] }

[documents]
evidence = ["work experience with numbers", "positions of responsibility", "the degree", "commercial awareness"]
letter_mentions = "one result with a number and why this firm"
hiring_titles = ["hiring manager", "graduate recruitment team", "head of finance", "marketing manager"]
prep_topics = ["commercial awareness", "numerical and situational tests", "competency questions"]
special_cases = []

[prompts]
letter = ""
cv_suggest = ""
