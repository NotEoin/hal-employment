# Built-in CV type. Copy it in My CV to change it; this file stays as it is.
id = "school_leaver"
name = "School leaver or apprenticeship"
fits = "No degree yet"
note = "School results, part-time work, clubs and volunteering."
order_words = "Profile, Strengths, Education, Work and activities"
length_words = "1 page"
pages = 1
section_order = ["summary", "skills", "education", "experience", "volunteering", "interests"]
optional_sections = ["achievements", "certifications", "languages"]
tips = [
  "Give your GCSE, A level or college results in one or two lines.",
  "Clubs, sport, Duke of Edinburgh, caring for family and part-time jobs all show what you can do.",
  "Apprenticeships and paid work experience weeks are made for people leaving school or college.",
]

[suggest]
stages = ["school_leaver"]
subjects = []
roles = ["apprentice"]

[sections.summary]
title = "Profile"
max_words = 60
[sections.skills]
title = "Strengths"
style = "list"
[sections.education]
title = "Education"
max_entries = 2
show_modules = "all"
dissertation = false
[sections.experience]
title = "Work and activities"
max_entries = 4
max_bullets = 2
[sections.volunteering]
title = "Volunteering"
max_entries = 2
max_bullets = 2
[sections.interests]
title = "Interests"
optional = true

[writing]
person = "none"
style = "bullets"
bullet_words = [6, 25]
verb_first = true
results = "rarely"
spelling = "en-GB"
tone = "plain"
banned = ["passionate", "team player", "go-getter", "references available on request"]

[checks]
profile_evidence = 1
skills_backed = 1
dates_one_format = 1
no_personal_data = 2
pages_within = 1
one_spelling = 1
entry_says_what = 1
contact_at_top = 1

[keywords]
skills = ["customer service", "teamwork", "communication", "reliability", "Excel", "cash handling",
          "time management", "first aid", "problem solving"]
aliases = { excel = ["spreadsheets"], "cash handling" = ["till", "cash"] }

[documents]
evidence = ["school or college results", "part-time work", "clubs and volunteering"]
letter_mentions = "why this apprenticeship and one thing you did that shows you are ready"
hiring_titles = ["apprenticeship coordinator", "hiring manager", "team leader"]
prep_topics = ["why this apprenticeship", "simple competency questions", "what you do outside school"]
special_cases = []

[prompts]
letter = ""
cv_suggest = ""
