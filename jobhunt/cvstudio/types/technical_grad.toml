# Built-in CV type. Copy it in My CV to change it; this file stays as it is.
id = "technical_grad"
name = "Technical graduate"
fits = "Computing, engineering and science graduates"
note = "Projects with tools and results. Numbers where you have them."
order_words = "Profile, Education, Projects, Experience, Skills"
length_words = "1 page preferred"
pages = 1
section_order = ["summary", "education", "projects", "experience", "skills"]
optional_sections = ["achievements", "certifications", "volunteering", "interests", "languages"]
tips = [
  "Each project says what it does, the tools you used and one result you can show.",
  "Write links out in full, so a reader who prints the page can still find your work.",
  "A paid internship, a placement year or a Knowledge Transfer Partnership counts as experience: give its dates and what you built.",
]

[suggest]
stages = ["new_grad", "early"]
subjects = ["computer", "computing", "software", "data science", "artificial intelligence", "cyber",
            "informatics", "information technology", "games", "electronic"]
roles = ["software", "developer", "programmer", "data analyst", "data engineer", "devops", "cyber",
         "machine learning", "web", "it support", "test engineer", "platform"]

[sections.summary]
title = "Profile"
max_words = 50
headlines = []
[sections.education]
title = "Education"
max_entries = 2
show_modules = "strong"
min_mark = 70
dissertation = false
[sections.projects]
title = "Projects"
max_entries = 4
max_bullets = 3
[sections.experience]
title = "Experience"
max_entries = 3
max_bullets = 3
[sections.skills]
title = "Skills"
style = "groups"

[writing]
person = "none"
style = "bullets"
bullet_words = [8, 35]
verb_first = true
results = "where_have"
spelling = "en-GB"
tone = "plain"
banned = ["passionate", "team player", "go-getter", "ninja", "rockstar", "guru", "references available on request"]

[checks]
profile_evidence = 1
result_bullets = 2
projects_with_evidence = 2
modules_strong = 1
education_first = 1
skills_backed = 2
dates_one_format = 1
no_personal_data = 2
pages_within = 1
one_spelling = 1
entry_says_what = 1
contact_at_top = 1
no_module_codes = 1
no_first_person = 1

[keywords]
skills = ["Python", "Java", "JavaScript", "TypeScript", "SQL", "Git", "Linux", "Docker", "AWS", "React",
          "testing", "REST", "data structures", "algorithms", "C++", "Excel", "machine learning"]
aliases = { javascript = ["js"], typescript = ["ts"], "machine learning" = ["ml"], aws = ["amazon web services"] }

[documents]
evidence = ["projects", "strong modules", "the degree", "work experience"]
letter_mentions = "the most relevant project and what it achieved"
hiring_titles = ["engineering manager", "engineering lead", "head of engineering", "technical lead"]
prep_topics = ["a coding exercise", "questions about your projects", "competency questions"]
special_cases = ["ktp"]

[prompts]
letter = ""
cv_suggest = ""
