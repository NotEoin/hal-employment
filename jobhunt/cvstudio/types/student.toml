# Built-in CV type. Copy it in My CV to change it; this file stays as it is.
id = "student"
name = "Student applying for paid internships and placement years"
fits = "Current students looking for paid internships, placement years, insight weeks and spring weeks"
note = "Your course and expected grade, when you are free, and anything you have done so far."
order_words = "Profile, Education, Experience, Activities, Skills"
length_words = "1 page"
pages = 1
section_order = ["summary", "education", "experience", "volunteering", "achievements", "skills", "interests"]
optional_sections = ["projects", "languages", "certifications"]
tips = [
  "Say when you are free: for example, a 12-month placement from July, or 10 weeks next summer.",
  "Give your expected or predicted grade, and your best module marks so far if they are strong.",
  "Part-time work, societies, sports teams and volunteering all count when you have little experience yet.",
  "Many schemes are for current students only. Apply while you are still studying, and look for spring and insight weeks in your first and second years.",
]

[suggest]
stages = ["student"]
subjects = []
roles = []

[sections.summary]
title = "Profile"
max_words = 50
[sections.education]
title = "Education"
max_entries = 2
show_modules = "strong"
min_mark = 60
dissertation = false
[sections.experience]
title = "Experience"
max_entries = 3
max_bullets = 3
[sections.volunteering]
title = "Volunteering"
max_entries = 2
max_bullets = 2
[sections.achievements]
title = "Activities and positions of responsibility"
max_entries = 3
max_bullets = 2
[sections.skills]
title = "Skills"
style = "groups"
[sections.interests]
title = "Interests"
optional = true

[writing]
person = "none"
style = "bullets"
bullet_words = [8, 30]
verb_first = true
results = "where_have"
spelling = "en-GB"
tone = "plain"
banned = ["passionate", "hard-working", "team player", "go-getter", "references available on request"]

[checks]
availability_line = 2
education_first = 2
profile_evidence = 1
entry_says_what = 1
dates_one_format = 1
no_personal_data = 2
pages_within = 1
one_spelling = 1
contact_at_top = 1

[keywords]
skills = ["Excel", "communication", "research", "customer service", "teamwork", "presenting", "writing",
          "data analysis", "organisation", "problem solving"]
aliases = { excel = ["spreadsheets", "microsoft excel"] }

[documents]
evidence = ["the course so far", "part-time work", "societies and activities", "volunteering"]
letter_mentions = "the course, when you are free and one thing you have done that fits"
hiring_titles = ["early careers team", "graduate recruitment team", "hiring manager"]
prep_topics = ["why this employer", "competency questions", "an online test or video interview"]
special_cases = []

[prompts]
letter = ""
cv_suggest = ""
