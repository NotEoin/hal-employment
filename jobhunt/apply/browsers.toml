# The browsers the helper step explains, in the order setup lists them.
# Each step has the words on screen and a simple drawing in static/app/setup/img/helper/.
# "Developer mode" and "Load unpacked" are quoted as each browser's own button names.
# The wording and positions were written from each browser's extensions page as of 2026-10;
# Opera and Brave are not yet checked against the real browsers.

[browsers.opera]
name = "Opera"
supported = true
extensions_url = "opera://extensions"
steps = [
  { text = "Open Opera's extensions page.", picture = "opera-1.svg" },
  { text = "Switch on \"Developer mode\" with the switch at the top right of the page.", picture = "opera-2.svg" },
  { text = "Press \"Load unpacked\" and choose Hal's helper folder.", picture = "opera-3.svg" },
]

