[project]
name = "hal-employment"
version = "2.0.0.dev0"
description = "Hal Employment: finds jobs, drafts applications and fills forms for the applicant to review and send."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.5",
    "pypdfium2>=4.30",
    "pyspellchecker>=0.8",
    "segno>=1.6",
    # Windows checks website certificates itself; see jobhunt/core/tls.py
    "truststore>=0.10; sys_platform == 'win32'",
]

[project.optional-dependencies]
browser = ["playwright>=1.48"]
# magika and onnxruntime need the Microsoft C++ runtime, so the extra is never installed on Windows.
documents = ["markitdown[pdf,docx,pptx,xlsx]>=0.1.8; sys_platform != 'win32'"]

[dependency-groups]
dev = ["ruff>=0.7"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobhunt"]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "PLC2401"]
