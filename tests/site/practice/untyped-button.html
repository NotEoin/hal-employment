<!doctype html><html><head><meta charset="utf-8"><title>Apply: Research Assistant</title></head><body>
<!-- The last page has an "Add another referee" button with no type and no script: under HTML it sends the form. -->
<h1>Apply: Research Assistant</h1>
<form method="post" action="/sent/untyped-button">
 <div><label for="fn">First name *</label><input id="fn" name="first_name" required></div>
 <div><label for="ln">Last name *</label><input id="ln" name="last_name" required></div>
 <div><label for="em">Email *</label><input id="em" name="email" type="email" required></div>
 <div><label for="rn">Referee name</label><input id="rn" name="referee"></div>
 <button>Add another referee</button>
 <button type="submit">Submit application</button>
</form></body></html>
