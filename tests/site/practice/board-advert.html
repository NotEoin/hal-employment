<!doctype html><html><head><meta charset="utf-8"><title>Graduate Analyst Job in Leeds</title>
<style>
 .mfp-wrap { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 1000; }
 .mfp-container { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
 .ea { background: #fff; padding: 24px; width: 420px; }
</style></head><body>
<!-- A job board's advert, as Adzuna lays one out (2026-11-04): the board's own job search with three boxes in
     one form, a job-alert box beside the advert, and a job-alert pop-up over the page that holds back clicks
     under it until it is closed. None of them is the application; "Apply for this job" leads to it. The pop-up
     is built as Adzuna's pop-up library builds it: no role, and layers named "mfp-wrap" and "mfp-container",
     closed by a "No, thanks" link. Closing it is kept in the tab's sessionStorage, so a test can see it from
     the form's page. -->
<form id="search" action="/search" method="get">
 <label for="q">What?</label><input id="q" name="q" value="Graduate Analyst">
 <label for="w">Where?</label><input id="w" name="w" value="Leeds">
 <label for="s">Salaries</label><select id="s" name="s"><option>Any</option><option>Analyst Jobs in Leeds</option></select>
 <button type="submit">Search</button>
</form>
<h1>Graduate Analyst</h1>
<p>Made-up Analytics Ltd is hiring a graduate analyst in Leeds.</p>
<a id="apply" href="single.html">Apply for this job</a>
<form id="alert-inline" action="/alerts" method="post">
 <label for="ae">Receive similar jobs by email</label><input id="ae" name="email" type="email">
 <button type="submit">Create alert</button>
</form>
<script>
{
  const pop = document.createElement('div');
  pop.className = 'mfp-wrap';
  pop.innerHTML = '<div class="mfp-container"><div class="ea"><h2>Graduate Analyst jobs in Leeds</h2>'
    + '<p>Leave us your email address and we\'ll send you similar new jobs.</p>'
    + '<form action="/alerts" method="post"><input id="pe" name="email" type="email" placeholder="your.name@example.org">'
    + '<button type="submit">Create email alert</button></form>'
    + '<a href="#" class="ea_close">No, thanks</a></div></div>';
  document.body.appendChild(pop);
  pop.querySelector('.ea_close').addEventListener('click', e => {
    e.preventDefault();
    sessionStorage.setItem('popupClosed', '1');
    pop.remove();
  });
  window.alertPopup = pop;
  document.getElementById('apply').addEventListener('click', e => {
    if (window.alertPopup.isConnected) e.preventDefault();
  });
}
</script>
</body></html>
