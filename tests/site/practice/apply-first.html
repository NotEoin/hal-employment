<!doctype html><html><head><meta charset="utf-8"><title>Community Officer - Fernvale Trust</title></head><body>
<!-- An advert whose way to the form is a control in the site's own words, which Hal does not know as Apply.
     Passed through a site note ("Press \"Express your interest\" before looking for the form"). -->
<h1>Community Officer</h1>
<p>Fernvale Trust is looking for a community officer in Leeds.</p>
<button type="button" id="interest">Express your interest</button>
<form method="post" action="/sent/apply-first" id="form" hidden>
 <div><label for="fn">First name *</label><input id="fn" name="first_name" required></div>
 <div><label for="ln">Last name *</label><input id="ln" name="last_name" required></div>
 <div><label for="em">Email *</label><input id="em" name="email" type="email" required></div>
 <button type="submit">Submit application</button>
</form>
<script>
document.querySelector('#interest').onclick = () => {
  document.querySelector('#form').hidden = false;
  document.querySelector('#interest').remove();
};
</script></body></html>
