<!doctype html><html><head><meta charset="utf-8"><title>Apply: Graduate Analyst</title></head><body>
<!-- A one-page form that really posts: gate G6 counts every POST on the server. -->
<h1>Apply: Graduate Analyst</h1>
<form method="post" action="/sent/single">
 <div><label for="fn">First name *</label><input id="fn" name="first_name" required></div>
 <div><label for="ln">Last name *</label><input id="ln" name="last_name" required></div>
 <div><label for="em">Email *</label><input id="em" name="email" type="email" required></div>
 <div><label for="ph">Phone</label><input id="ph" name="phone" type="tel"></div>
 <button type="submit">Submit application</button>
</form></body></html>
