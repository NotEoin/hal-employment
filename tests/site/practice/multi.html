<!doctype html><html><head><meta charset="utf-8"><title>Apply: Junior Planner</title>
<style>.hide{display:none}</style></head><body>
<!-- Two pages in one form: Next is a plain button, the last page posts. -->
<h1>Apply: Junior Planner</h1>
<form method="post" action="/sent/multi">
 <section id="one">
  <div><label for="fn">First name *</label><input id="fn" name="first_name" required></div>
  <div><label for="ln">Last name *</label><input id="ln" name="last_name" required></div>
  <div><label for="em">Email *</label><input id="em" name="email" type="email" required></div>
  <button type="button" id="next">Next</button>
 </section>
 <section id="two" class="hide">
  <div><label for="ph">Phone *</label><input id="ph" name="phone" type="tel" required></div>
  <div><label for="city">City *</label><input id="city" name="city" required></div>
  <button type="submit" id="send">Send application</button>
 </section>
</form>
<script>
document.querySelector('#next').onclick = () => {
  document.querySelector('#one').classList.add('hide');
  document.querySelector('#two').classList.remove('hide');
};
</script></body></html>
