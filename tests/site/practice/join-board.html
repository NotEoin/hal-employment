<!doctype html><html><head><meta charset="utf-8"><title>Made-up Jobs</title></head><body>
<!-- A job board's own account page between the advert and the employer, as Adzuna's register page is
     (2026-11-05): an email address, a password and the password again. It is the board's account, not the
     application, and only the person may make one. -->
<h1>Welcome to Made-up Jobs</h1>
<form method="post" action="/sent/join-board">
 <label for="em">Email address</label><input id="em" name="email" type="email">
 <label for="pw">Password</label><input id="pw" name="password" type="password">
 <label for="pw2">Confirm password</label><input id="pw2" name="confirm" type="password">
 <button type="submit">Continue</button>
</form>
</body></html>
