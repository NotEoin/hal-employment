<!doctype html><html><head><meta charset="utf-8"><title>Junior Sound Engineer Job | Made-up Media Jobs</title></head><body>
<!-- A job board that wraps its whole page in one form, as ASP.NET sites do (ProductionBase, 2026-11-04): its
     own job search sits in a "search-section" with boxes labelled only by placeholders and by "Job Types" and
     "Industry", and a job-alert panel asks for an email address. None of them is the application, and all
     share the page's one form, so only where each box sits says so. "Apply now" leads to the application. -->
<form id="page" method="post" action="./junior-sound-engineer">
 <div class="newjobsearchbox-section"><div class="search-section">
  <input type="text" name="ctl00$Main$uxJobSearchBox$uxSearchArea" placeholder="e.g Production Manager, London">
  <input type="text" placeholder="Location">
  <label for="jt">Job Types</label><select id="jt"><option>Full-time</option><option>Freelance</option></select>
  <label for="ind">Industry</label><select id="ind"><option>Media &amp; Entertainment</option><option>Theatre</option></select>
  <input type="submit" name="ctl00$Main$uxJobSearchBox$uxSearchjob" value="Update">
 </div></div>
 <h1>Junior Sound Engineer</h1>
 <p>Made-up Studios is hiring a junior sound engineer in Leeds.</p>
 <a id="apply" href="single.html">Apply now</a>
 <div class="sidebar"><div class="alerts">
  <h3>Latest job alerts direct to your inbox</h3>
  <input type="email" placeholder="Email address">
  <label for="at">Job type</label><select id="at"><option>Sound</option><option>Camera</option></select>
  <input type="submit" value="Send Me Job Alerts">
 </div></div>
</form>
</body></html>
